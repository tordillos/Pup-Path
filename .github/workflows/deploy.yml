name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez: si llegan varios push seguidos, cancela el anterior.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run check

      - name: Build
        # Las PUBLIC_* se incrustan en el bundle durante el build, así que tienen
        # que existir aquí y no en tiempo de ejecución. Van como Variables (no
        # Secrets) porque son públicas por diseño: quien protege los datos es el
        # RLS de Supabase, no ocultar la key.
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # `pages deploy` contra un proyecto inexistente intenta preguntar de forma
      # interactiva y en CI muere sin mensaje. Lo creamos antes; si ya existe,
      # Cloudflare devuelve error y lo ignoramos.
      - name: Asegurar que existe el proyecto de Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create pup-path \
            --production-branch=main || echo "El proyecto ya existía, seguimos."

      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=pup-path --branch=${{ github.ref_name }}
